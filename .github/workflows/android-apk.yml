name: APK da câmera da mão
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mao-camera-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Preparar download
        run: cp app/build/outputs/apk/debug/app-debug.apk mao-camera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mao-camera-apk
          path: mao-camera.apk
      - name: Publicar APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mao-camera-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" mao-camera.apk --target "$GITHUB_SHA" --title "Mão câmera ${GITHUB_RUN_NUMBER}" --notes "APK Android 8+. Permita a câmera e mostre sua mão. Requer internet para carregar o detector. Versão de teste assinada automaticamente; ainda não validada em celular físico."
