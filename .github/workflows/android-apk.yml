name: APK da câmera da mão
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mao-camera-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Incluir detector completo no APK
        run: |
          mkdir -p app/src/main/assets/mediapipe
          curl --fail --location --retry 3 https://registry.npmjs.org/@mediapipe/hands/-/hands-0.4.1675469240.tgz -o "$RUNNER_TEMP/hands.tgz"
          tar -xzf "$RUNNER_TEMP/hands.tgz" --strip-components=1 -C app/src/main/assets/mediapipe
          test -s app/src/main/assets/mediapipe/hands.js
          test -s app/src/main/assets/mediapipe/hands_solution_packed_assets.data
          test -s app/src/main/assets/mediapipe/hand_landmark_lite.tflite
          test -s app/src/main/assets/mediapipe/hands_solution_simd_wasm_bin.wasm
          test -s app/src/main/assets/mediapipe/hands_solution_wasm_bin.wasm
      - name: Incluir renderizador 3D offline
        run: |
          mkdir -p app/src/main/assets/vendor
          curl --fail --location --retry 3 https://registry.npmjs.org/three/-/three-0.160.0.tgz -o "$RUNNER_TEMP/three.tgz"
          tar -xzf "$RUNNER_TEMP/three.tgz" -O package/build/three.min.js > app/src/main/assets/vendor/three.min.js
          tar -xzf "$RUNNER_TEMP/three.tgz" -O package/LICENSE > app/src/main/assets/vendor/THREE-LICENSE.txt
          test -s app/src/main/assets/vendor/three.min.js
      - name: Testar detector sem rede externa
        run: |
          npm install --prefix "$RUNNER_TEMP/offline-check" --no-audit --no-fund playwright@1.56.1
          NODE_PATH="$RUNNER_TEMP/offline-check/node_modules" node scripts/check-offline.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-preview
          path: |
            ui-preview.png
            stereo-preview.png
            mobile-preview.png
            test-results.json
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Preparar download
        run: cp app/build/outputs/apk/debug/app-debug.apk mao-camera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mao-camera-apk
          path: mao-camera.apk
      - name: Publicar APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mao-camera-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" mao-camera.apk --target "$GITHUB_SHA" --title "Mão câmera ${GITHUB_RUN_NUMBER}" --notes "APK Android 8+. Permita a câmera e mostre sua mão. Mundo 3D estereoscópico e mãos offline. AVME experimental, sem garantia de 6DoF. Consulte docs/STATUS.md para módulos pendentes. Versão de teste assinada automaticamente; ainda não validada em celular físico."
