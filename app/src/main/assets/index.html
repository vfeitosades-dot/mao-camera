<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel espacial</title><style>
body{margin:0;background:#10151d;color:#fff;text-align:center;font:16px system-ui}button,input,select{padding:10px;border:0;border-radius:12px;margin:3px}button{background:#c6e4ff;color:#102030}input{max-width:50%;background:#253249;color:white}#preview{display:flex;max-width:900px;margin:auto;background:#000}.eye{position:relative;width:100%;min-width:0}.second{display:none}video{display:block;width:100%}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#assistant{padding:10px;color:#b9e8ff}body.vr header,body.vr #assistant,body.vr #status{display:none}body.vr #preview{max-width:none;height:100dvh;align-items:center}body.vr .eye{width:50%}body.vr .second{display:block}#vr{position:fixed;right:5px;top:5px;z-index:10;opacity:.8}</style>
<header><h3>Painel espacial</h3><button id="start">Ativar câmera traseira</button><select id="count"><option value="1">1 mão</option><option value="2">2 mãos</option></select><button id="reset">Reposicionar</button><div><input id="url" type="url" value="https://www.google.com" aria-label="Endereço do site"><button id="open">Abrir site</button><button id="draw">Desenhar 3D</button><button id="clear">Limpar</button></div></header><button id="vr">Modo VR</button><p id="assistant">Use a pinça para interagir com o painel.</p><p id="status">Sites abrem no navegador do celular. Desenho e painel funcionam offline.</p><div id="preview"><div class="eye"><video autoplay muted playsinline></video><canvas></canvas></div><div class="eye second"><video id="rightVideo" autoplay muted playsinline></video><canvas id="rightCanvas"></canvas></div></div><script src="/mediapipe/hands.js"></script><script>
'use strict';
const video=document.querySelector('video'),canvas=document.querySelector('canvas');
const ctx=canvas.getContext('2d'),message=document.querySelector('#status');
const button=document.querySelector('#start'),count=document.querySelector('#count');
const edges=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
let running=false,stream,hands,epoch=0,callback=0,pending=Promise.resolve();
let lastVideoTime=-1,lastInference=-Infinity;
const interval=1000/20;
const rightVideo=document.querySelector('#rightVideo'),rightCanvas=document.querySelector('#rightCanvas');
const rightCtx=rightCanvas.getContext('2d');
let vr=false,mode='painel',pinched=false,grabbing=false,grip=null;
let panel={x:.5,y:.43,scale:1},strokes=[],activeStroke=null,lastHand=null;
const assistant=document.querySelector('#assistant');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function place(x,y){panel.x=clamp(x,.25,.75);panel.y=clamp(y,.25,.75);}
function resetQuad(){strokes=[];activeStroke=null;mode='painel';panel={x:.5,y:.43,scale:1};}
function panelBounds(){return {x:panel.x-.25*panel.scale,y:panel.y-.19*panel.scale,w:.5*panel.scale,h:.38*panel.scale};}
function hitButton(x,y){
 const b=panelBounds(),u=(x-b.x)/b.w,v=(y-b.y)/b.h;
 if(v<.35||v>.84||u<.05||u>.95)return -1;
 return Math.min(2,Math.floor((u-.05)/.3));
}
function openSite(){
 const field=document.querySelector('#url');let value=field.value.trim();
 if(!/^https?:\/\//i.test(value))value='https://'+value;
 try{const u=new URL(value);if(!['https:','http:'].includes(u.protocol)||!u.hostname.includes('.'))throw Error();window.location.href=u.href;}catch(e){say('Digite um endereço de site válido.');}
}
function action(i){if(i===0)openSite();if(i===1){mode=mode==='desenho'?'painel':'desenho';activeStroke=null;}if(i===2){strokes=[];activeStroke=null;}}
function gesture(points){
 lastHand=points;
 if(!points){pinched=false;grabbing=false;activeStroke=null;return;}
 const d=(a,b)=>Math.hypot((a.x-b.x)*video.videoWidth,(a.y-b.y)*video.videoHeight);
 const palm=d(points[0],points[9]);if(palm<10)return;
 const ratio=d(points[4],points[8])/palm,was=pinched;
 if(!pinched&&ratio<.32)pinched=true;else if(pinched&&ratio>.5)pinched=false;
 const x=(points[4].x+points[8].x)/2,y=(points[4].y+points[8].y)/2;
 if(!pinched){grabbing=false;activeStroke=null;return;}
 if(!was){
  const b=panelBounds();
  if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h*.28){grabbing=true;grip={x:panel.x-x,y:panel.y-y,palm,scale:panel.scale};return;}
  const hit=hitButton(x,y);if(hit>=0){action(hit);activeStroke=null;return;}
  if(mode==='desenho'){activeStroke=[];strokes.push(activeStroke);if(strokes.length>60)strokes.shift();}
 }
 if(grabbing){place(x+grip.x,y+grip.y);panel.scale=clamp(grip.scale*palm/grip.palm,.6,1.25);}
 else if(mode==='desenho'&&activeStroke){
  const z=clamp((palm/Math.max(video.videoHeight,1)-.3)*2,-.6,.6);
  const point={x:(x-.5)*(2+z)/2,y:(y-.5)*(2+z)/2,z};
  const last=activeStroke[activeStroke.length-1];
  if(!last||Math.hypot(point.x-last.x,point.y-last.y,point.z-last.z)>.008)activeStroke.push(point);
  if(activeStroke.length>700)activeStroke.shift();
 }
}
function project(p,w,h,eye=0){const f=2/(2+p.z);return{x:(.5+p.x*f+eye*p.z*.01)*w,y:(.5+p.y*f)*h};}
function paintScene(c,w,h,eye=0){
 c.lineCap='round';c.lineJoin='round';
 for(const stroke of strokes){if(stroke.length<2)continue;c.beginPath();stroke.forEach((p,i)=>{const v=project(p,w,h,eye);if(i)c.lineTo(v.x,v.y);else c.moveTo(v.x,v.y);});c.strokeStyle='#69f5ff';c.lineWidth=4;c.stroke();}
 const b=panelBounds(),x=b.x*w,y=b.y*h,bw=b.w*w,bh=b.h*h;
 c.fillStyle='rgba(6,12,24,.3)';c.fillRect(x+8,y+10,bw,bh);
 c.beginPath();c.roundRect(x,y,bw,bh,18);c.fillStyle='rgba(23,31,48,.93)';c.fill();c.strokeStyle='rgba(200,225,255,.55)';c.lineWidth=1;c.stroke();
 c.fillStyle='#f2f6ff';c.font='bold '+Math.max(12,bw*.055)+'px sans-serif';c.textAlign='center';
 c.fillText('PAINEL ESPACIAL',x+bw/2,y+bh*.18);
 const labels=['Abrir site',mode==='desenho'?'Sair desenho':'Desenhar 3D','Limpar'];
 labels.forEach((label,i)=>{const bx=x+bw*(.05+.3*i),by=y+bh*.35;c.beginPath();c.roundRect(bx,by,bw*.27,bh*.49,10);c.fillStyle=i===1&&mode==='desenho'?'#17696d':'#35435d';c.fill();c.fillStyle='white';c.font=Math.max(10,bw*.041)+'px sans-serif';c.fillText(label,bx+bw*.135,by+bh*.27);});
 c.textAlign='start';
}
function advise(){const text=grabbing?'Mova a mão para posicionar o painel. Aproxime para aumentar.':mode==='desenho'?'Faça pinça fora do painel para desenhar. Abra para terminar o traço.':'Faça pinça em uma opção. Segure a barra superior para mover o painel.';
 if(assistant.textContent!==text)assistant.textContent=text;
}
document.querySelector('#reset').onclick=resetQuad;
document.querySelector('#open').onclick=openSite;
document.querySelector('#draw').onclick=()=>action(1);
document.querySelector('#clear').onclick=()=>action(2);
document.querySelector('#vr').onclick=async()=>{
 vr=!vr;document.body.classList.toggle('vr',vr);document.querySelector('#vr').textContent=vr?'Sair VR':'Modo VR';
 if(vr){rightVideo.srcObject=stream;rightVideo.play().catch(()=>{});try{await document.documentElement.requestFullscreen();}catch(e){}try{await screen.orientation.lock('landscape');}catch(e){}}
 else{rightVideo.pause();try{screen.orientation.unlock();}catch(e){}if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}
};
function say(text){if(message.textContent!==text)message.textContent=text;}
function cancelFrame(){
 if(video.cancelVideoFrameCallback)video.cancelVideoFrameCallback(callback);
 else cancelAnimationFrame(callback);
}
function stop(){
 ++epoch;running=false;cancelFrame();
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 rightVideo.pause();rightVideo.srcObject=null;grabbing=false;pinched=false;
 rightCtx.clearRect(0,0,rightCanvas.width,rightCanvas.height);
 video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);
 button.hidden=false;button.disabled=false;count.disabled=false;
}
function draw(result){
 if(!running||document.hidden)return;
 const w=video.videoWidth,h=video.videoHeight;
 if(!w||!h)return;
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 ctx.clearRect(0,0,w,h);
 const detected=result.multiHandLandmarks||[];
 gesture(detected[0]);advise();
 ctx.strokeStyle='#45edac';ctx.lineWidth=3;ctx.lineCap='round';
 ctx.fillStyle='#fff';
 for(const points of detected){
  ctx.beginPath();
  for(const [a,b]of edges){ctx.moveTo(points[a].x*w,points[a].y*h);ctx.lineTo(points[b].x*w,points[b].y*h);}
  ctx.stroke();ctx.beginPath();
  for(const p of points){ctx.moveTo(p.x*w+4,p.y*h);ctx.arc(p.x*w,p.y*h,4,0,Math.PI*2);}
  ctx.fill();
 }
 paintScene(ctx,w,h);
 if(vr){if(rightCanvas.width!==w||rightCanvas.height!==h){rightCanvas.width=w;rightCanvas.height=h;}rightCtx.clearRect(0,0,w,h);rightCtx.drawImage(canvas,0,0);}
 say(detected.length?'Mão detectada — use a pinça.':'Mostre sua mão para interagir.');
}
function schedule(token){
 if(!running||token!==epoch)return;
 const next=now=>frame(now,token);
 callback=video.requestVideoFrameCallback?video.requestVideoFrameCallback(next):requestAnimationFrame(next);
}
async function frame(now,token){
 if(!running||token!==epoch)return;
 if(video.readyState<2||video.currentTime===lastVideoTime||now-lastInference<interval){schedule(token);return;}
 lastVideoTime=video.currentTime;lastInference=now;
 try{
  pending=hands.send({image:video});await pending;
  schedule(token);
 }catch(error){if(token===epoch){stop();say('Falha no detector. Feche e abra o app para reiniciar o detector.');}}
}
button.onclick=async()=>{
 const token=++epoch;button.disabled=true;count.disabled=true;
 try{
  await pending.catch(()=>{});
  if(token!==epoch)return;
  say('Carregando detector…');
  if(!hands){hands=new Hands({locateFile:f=>'/mediapipe/'+f});hands.onResults(draw);}
  await hands.setOptions({maxNumHands:Number(count.value),modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});
  if(token!==epoch)return;
  const acquired=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'environment'},width:{ideal:480,max:640},height:{ideal:360,max:480},frameRate:{ideal:24,max:24}}});
  if(token!==epoch||document.hidden){acquired.getTracks().forEach(t=>t.stop());return;}
  stream=acquired;video.srcObject=stream;await video.play();if(vr){rightVideo.srcObject=stream;await rightVideo.play();}
  if(token!==epoch)return;
  running=true;lastVideoTime=-1;lastInference=-Infinity;button.hidden=true;
  say('Mostre sua mão para a câmera.');schedule(token);
 }catch(error){if(token===epoch){stop();say(error.name==='OverconstrainedError'?'Câmera traseira indisponível neste dispositivo.':'Confira a permissão da câmera e tente novamente.');}}
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();say('Câmera pausada. Toque em Ativar câmera para continuar.');}});
window.addEventListener('pagehide',stop);
</script></html>
