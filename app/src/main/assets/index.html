<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mão</title><style>body{margin:0;background:#10151d;color:white;text-align:center;font:17px system-ui}canvas{width:100%;max-width:720px}button{padding:16px;border:0;border-radius:12px;background:#45edac;font-weight:bold}video{display:none}</style><h2>✋ Esqueleto da mão</h2><button id="start">Ativar câmera</button><p id="status">Mostre sua mão inteira para a câmera.</p><video autoplay muted playsinline></video><canvas></canvas><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script><script>
const video=document.querySelector('video'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),button=document.querySelector('button');
const edges=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
let running=false,stream,hands;
function stop(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());button.hidden=false;button.disabled=false;}
button.onclick=async()=>{button.disabled=true;try{status.textContent='Carregando detector…';if(!hands){hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});hands.onResults(r=>{canvas.width=video.videoWidth;canvas.height=video.videoHeight;let w=canvas.width,h=canvas.height;ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(r.image,0,0,w,h);for(const points of r.multiHandLandmarks||[]){ctx.strokeStyle='#45edac';ctx.lineWidth=4;for(const [a,b]of edges){ctx.beginPath();ctx.moveTo(points[a].x*w,points[a].y*h);ctx.lineTo(points[b].x*w,points[b].y*h);ctx.stroke();}ctx.fillStyle='white';for(const p of points){ctx.beginPath();ctx.arc(p.x*w,p.y*h,5,0,Math.PI*2);ctx.fill();}}ctx.restore();status.textContent=r.multiHandLandmarks?.length?'Mão detectada ✓':'Mostre sua mão para a câmera.';});}stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:640,height:480}});video.srcObject=stream;await video.play();running=true;button.hidden=true;async function frame(){if(!running)return;try{await hands.send({image:video});requestAnimationFrame(frame);}catch(e){stop();status.textContent='Falha no detector. Confira a internet e tente novamente.';}}frame();}catch(e){stop();status.textContent='Confira a internet e a permissão da câmera e tente novamente.';}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script></html>
