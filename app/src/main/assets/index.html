<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Horizon Pocket VR</title><link rel="stylesheet" href="/style.css">
<body><main id="world"></main><video id="camera" autoplay muted playsinline></video><canvas id="probe" width="96" height="72" hidden></canvas>
<header><div><strong>HORIZON <span>POCKET VR</span></strong><small>Ambiente 3D · construção independente</small></div><button id="menu">☰ Biblioteca</button><button id="cameraToggle">Ativar mãos</button><button id="vr">Entrar VR</button><button id="center">Recentrar</button><button id="pause">Pausa</button></header>
<aside id="sidebar"><h2>Configuração do visor</h2><p>Use sentado ou parado. Libere a câmera traseira se o VR Box a obstruir. Você pode usar toque sem câmera ou sensores.</p>
<label>Rastreamento<select id="tracking"><option value="auto">Automático: sensores → visual → toque</option><option value="sensor">Somente sensores</option><option value="visual">AVME · câmera experimental</option><option value="manual">Toque / controle</option></select></label>
<label>Ambiente<select id="environment"><option value="home">Casa moderna</option><option value="mountain">Terraço nas montanhas</option><option value="space">Observatório espacial</option><option value="minimal">Minimalista</option></select></label>
<label>Qualidade<select id="quality"><option value="low">Econômico</option><option value="balanced" selected>Equilibrado</option><option value="high">Alta</option></select></label>
<label>Mãos<select id="handCount"><option value="1">1 mão · mais leve</option><option value="2">2 mãos</option></select></label>
<label>IPD virtual <output id="ipdOut"></output><input id="ipd" type="range" min="45" max="80" value="64"></label>
<label>Campo de visão<input id="fov" type="range" min="45" max="100" value="75"></label>
<label>Distorção radial manual<input id="distortion" type="range" min="-30" max="40" value="0"></label>
<label>Distância dos painéis<input id="distance" type="range" min="100" max="280" value="170"></label>
<label>Seleção por permanência<input id="dwell" type="checkbox"></label><label>Mãos sólidas<input id="solidHands" type="checkbox"></label><label>Passthrough monocular experimental<input id="passthrough" type="checkbox"></label>
<button id="diagnostics">Diagnóstico real</button><button id="reset">Apagar preferências e projetos</button><button id="closeSettings">Fechar ajustes</button><pre id="device"></pre></aside>
<section id="toolbox" hidden><h2 id="appTitle"></h2><div id="appBody"></div><button id="closeApp">Fechar aplicativo</button></section>
<div id="toast" role="status"></div><footer><span id="status">Toque e arraste para olhar. Pinça para selecionar.</span><span id="metrics"></span><button id="settings">⚙ Ajustes</button><button id="select">Selecionar centro</button></footer>
<div id="reticle">◌</div><input id="file" type="file" accept="image/*,video/*" hidden>
<script src="/vendor/three.min.js"></script><script src="/mediapipe/hands.js"></script><script src="/hands.js"></script><script src="/motion.js"></script><script src="/app.js"></script></body></html>
